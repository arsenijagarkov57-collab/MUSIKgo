<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e0e">
  <meta name="robots" content="noindex, nofollow">
  <title>Моя Музыка — подключаемся...</title>
  <!--
    Постоянная ссылка на GitHub Pages. run_service.py автоматически меняет
    TARGET_URL и href у «direct-link» при каждом новом туннеле Pinggy.
    Маркеры __PINGGY_URL__ / __PINGGY_URL_LINK__ удалять нельзя.
  -->
  <style>
    :root {
      --bg: #0e0e0e;
      --panel: #181818;
      --accent: #ffcc00;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, .52);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(900px 520px at 50% -10%, rgba(255, 204, 0, .11), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: "YS Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .card {
      width: min(92vw, 480px);
      padding: 46px 38px 40px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
      border: 1px solid rgba(255, 255, 255, .07);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .55);
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--muted);
      margin-bottom: 38px;
    }

    .logo-mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #111;
      font-size: 18px;
      line-height: 1;
    }

    .equalizer {
      height: 64px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 7px;
      margin-bottom: 30px;
    }

    .equalizer span {
      width: 9px;
      border-radius: 999px;
      background: var(--accent);
      transform-origin: bottom;
      animation: bounce 1.1s ease-in-out infinite alternate;
    }

    .equalizer span:nth-child(1) { height: 22px; animation-delay: -.9s; }
    .equalizer span:nth-child(2) { height: 48px; animation-delay: -.6s; }
    .equalizer span:nth-child(3) { height: 64px; animation-delay: -.3s; }
    .equalizer span:nth-child(4) { height: 38px; animation-delay: -.75s; }
    .equalizer span:nth-child(5) { height: 28px; animation-delay: -.15s; }

    @keyframes bounce {
      from { transform: scaleY(.28); opacity: .55; }
      to   { transform: scaleY(1); opacity: 1; }
    }

    h1 {
      font-size: clamp(20px, 5vw, 26px);
      line-height: 1.25;
      margin: 0 0 12px;
      font-weight: 700;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .dots::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }

    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
    }

    .progress {
      margin: 34px auto 30px;
      width: 100%;
      max-width: 260px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .09);
      overflow: hidden;
    }

    .progress::before {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      animation: slide 1.25s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-105%); }
      100% { transform: translateX(255%); }
    }

    .direct {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      padding: 10px 4px;
      border-bottom: 1px solid rgba(255, 204, 0, .35);
    }

    .direct:hover { border-bottom-color: var(--accent); }

    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(255, 255, 255, .32);
    }

    @media (prefers-reduced-motion: reduce) {
      .equalizer span, .progress::before, .dots::after { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><span class="logo-mark">♪</span> Моя Музыка</div>

    <div class="equalizer" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <h1>Подключаемся к музыкальному серверу<span class="dots"></span></h1>
    <p>Секунду — сейчас откроется ваша библиотека.</p>

    <div class="progress" aria-hidden="true"></div>

    <!-- run_service.py обновляет href при каждом новом туннеле -->
    <a id="direct-link" class="direct" href="https://stickers-cbs-garmin-experiments.trycloudflare.com">Открыть напрямую</a> <!-- __PINGGY_URL_LINK__ -->

    <div class="hint">Не перенаправило? Нажмите ссылку выше.</div>
  </main>

  <script>
    // Строку ниже меняет run_service.py при переподключении Pinggy.
    const TARGET_URL = 'https://stickers-cbs-garmin-experiments.trycloudflare.com'; // __PINGGY_URL__

    const link = document.getElementById('direct-link');
    if (link) link.href = TARGET_URL;

    // Мгновенный редирект: страница-загрузчик остаётся видимой, пока
    // браузер устанавливает соединение с туннелем.
    window.location.replace(TARGET_URL);
  </script>
</body>
</html>
